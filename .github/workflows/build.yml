name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (Optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev libyaml-dev curl tar

      - name: Build Kernel
        run: |
          # Set random tag if not provided
          if [ -z "${{ github.event.inputs.tag }}" ]; then
            TAG="v$(date +'%Y%m%d%H%M')"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          
          # Run build script
          bash build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droidspaces-KSUN-Samsung-SCV41
          path: build/Droidspaces-KSUN-Samsung-SCV41.tar

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: "Kernel Release ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "build/Droidspaces-KSUN-Samsung-SCV41.tar"
          body: "Automated build of Droidspaces-KSUN Kernel.\nCommit: ${{ github.sha }}"
